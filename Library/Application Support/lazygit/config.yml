gui:
  skipDiscardChangeWarning: true
  skipStashWarning: true
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - bold
      - underline
      # - reverse
git:
  # lazygit changed the default to date; recency (reflog order) is the old behaviour
  localBranchSortOrder: recency
  branchLogCmd: "git log --graph {{branchName}} --"
  diffRenderers:
    - colorArg: always
      command: delta --true-color never --paging=never
  allBranchesLogCmds:
    - git log --graph --all
refresher:
  refreshInterval: 2 # file/submodule refresh interval in seconds
  fetchInterval: 300 # re-fetch interval in seconds
notARepository: "skip"
promptToReturnFromSubprocess: false
keybinding:
  files:
    toggleTreeView: "ö" # default is ` which is undetectable`
quitOnTopLevelReturn: true
